name: Core tests

on:
  push:
    branches:
      - main
      - fix/critical-stability
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-tests:
    name: Build and test Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/AlexIsland.Core.Tests/AlexIsland.Core.Tests.csproj
      - name: Run Core tests
        run: dotnet test tests/AlexIsland.Core.Tests/AlexIsland.Core.Tests.csproj --configuration Release --no-restore
